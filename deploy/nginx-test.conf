# /etc/nginx/sites-available/sema-test
# Sema — test.sema.sozo.co.ke (test)
#
# Setup:
#   sudo cp this file /etc/nginx/sites-available/sema-test
#   sudo ln -s /etc/nginx/sites-available/sema-test /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d test.sema.sozo.co.ke
#   sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS ──────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name test.sema.sozo.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://test.sema.sozo.co.ke$request_uri;
    }
}

# ── MAIN HTTPS BLOCK ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test.sema.sozo.co.ke;

    ssl_certificate     /etc/letsencrypt/live/test.sema.sozo.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.sema.sozo.co.ke/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout          5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;

    # Test environment — restrict to known IPs if needed
    # allow 1.2.3.4;
    # deny all;

    access_log /var/log/nginx/sema_test_access.log;
    error_log  /var/log/nginx/sema_test_error.log warn;

    client_max_body_size    2m;
    client_body_timeout     12s;
    client_header_timeout   12s;
    keepalive_timeout       15s;
    send_timeout            10s;

    if ($host != "test.sema.sozo.co.ke") {
        return 444;
    }

    location / {
        proxy_pass         http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass  $http_upgrade;
        proxy_read_timeout  30s;
        proxy_connect_timeout 5s;
    }

    location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|conf|bak|old|swp)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
