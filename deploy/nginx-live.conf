# /etc/nginx/sites-available/sema-live
# Sema — sema.sozo.co.ke (live)

# ── HTTP → HTTPS ──────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sema.sozo.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://sema.sozo.co.ke$request_uri;
    }
}

# ── MAIN HTTPS BLOCK ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sema.sozo.co.ke;

    ssl_certificate     /etc/letsencrypt/live/sema.sozo.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sema.sozo.co.ke/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout          5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    server_tokens off;

    access_log /var/log/nginx/sema_live_access.log;
    error_log  /var/log/nginx/sema_live_error.log warn;

    client_max_body_size    2m;
    client_body_timeout     12s;
    client_header_timeout   12s;
    keepalive_timeout       15s;
    send_timeout            10s;

    if ($http_user_agent ~* (masscan|nikto|sqlmap|nmap|dirbuster|nessus|openvas)) {
        return 444;
    }

    if ($host != "sema.sozo.co.ke") {
        return 444;
    }

    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass  $http_upgrade;
        proxy_read_timeout  30s;
        proxy_connect_timeout 5s;
    }

    location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|conf|bak|old|swp)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
